name: Quality Check (Lint, Test, Sonarcloud)
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Run Linting
        run: npm run lint
      # Temporarily focus CI on Apple Pay until its integration is green.
      - name: Run Apple Pay tests
        run: >-
          npm run test:coverage --
          src/tests/PCPApplePaySession.spec.ts
          src/tests/loadWalletScript.spec.ts
          src/tests/express-checkout.spec.ts
          applepay-demo/src/
          --testNamePattern='^(?!Google Pay Express|PayPal Express)'
          --coverage.include=src/lib/PCPApplePaySession.ts
          --coverage.include=src/lib/loadWalletScript.ts
      - name: Build public SDK
        run: npm run build
      - name: Build Apple Pay Standard and Express demos
        run: |
          npm --prefix applepay-demo ci
          npm --prefix applepay-demo run build
      - name: Run SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
