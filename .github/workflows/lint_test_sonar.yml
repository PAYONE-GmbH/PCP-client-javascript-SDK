name: Quality Check (Lint, Test, Sonarcloud)
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Run Linting
        run: npm run lint
      - name: Install Google Pay demo dependencies
        run: npm --prefix googlepay-demo ci
      # PayPal will be re-enabled with its integration.
      - name: Run Apple Pay, Google Pay and tokenizer tests
        run: >-
          npm run test:coverage --
          src/tests/PCPApplePaySession.spec.ts
          src/tests/loadWalletScript.spec.ts
          src/tests/PCPCreditCardTokenizer.spec.ts
          src/tests/PCPFingerprintingTokenizer.spec.ts
          src/tests/loadTokenizerResource.spec.ts
          src/tests/tokenizer-demos.spec.ts
          src/tests/express-checkout.spec.ts
          applepay-demo/src/
          googlepay-demo/src/
          --testNamePattern='^(?!PayPal Express)'
          --coverage.include=src/lib/PCPApplePaySession.ts
          --coverage.include=src/lib/loadWalletScript.ts
          --coverage.include=src/lib/PCPCreditCardTokenizer.ts
          --coverage.include=src/lib/PCPFingerprintingTokenizer.ts
          --coverage.include=src/lib/loadTokenizerResource.ts
          --coverage.include=src/lib/PCPGooglePayExpress.ts
      - name: Build public SDK
        run: npm run build
      - name: Build Apple Pay Standard and Express demos
        run: |
          npm --prefix applepay-demo ci
          npm --prefix applepay-demo run build
      - name: Build tokenizer demos
        run: |
          npm --prefix creditcard-tokenizer-demo ci
          npm --prefix creditcard-tokenizer-demo run build
          npm --prefix fingerprinting-tokenizer-demo ci
          npm --prefix fingerprinting-tokenizer-demo run build
      - name: Build Google Pay Standard and Express demos
        run: npm --prefix googlepay-demo run build
      - name: Run SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
